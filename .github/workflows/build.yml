name: build
on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - run: gh release download --repo fusionlanguage/fut --pattern fut_*_amd64.deb --dir /tmp/pkg
      - run: sudo apt-get install -y /tmp/pkg/*.deb libpng-dev
      - uses: actions/checkout@main
      - run: make recoil2png
